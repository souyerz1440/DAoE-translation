version: 1

extends:
  - toc.yml

project:
  title: Design and Analysis of Experiments（中文翻译）
  description: Montgomery《试验设计与分析》中文翻译项目
  numbering:
    equations: false
  static_files:
    - LXGWWenKai-Regular.ttf
  keywords:
